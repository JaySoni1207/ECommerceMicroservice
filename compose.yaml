services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ordersdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── RabbitMQ ────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OrderService ────────────────────────────────────────────────────────────
  orderservice:
    image: orderservice
    build:
      context: .
      dockerfile: OrderService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__PostgresConnection: "Host=postgres-db;Port=5432;Database=ordersdb;Username=admin;Password=admin123"
      RabbitMqConfiguration__HostName: "rabbitmq"
      RabbitMqConfiguration__UserName: "guest"
      RabbitMqConfiguration__Password: "guest"
      RabbitMqConfiguration__Port: "5672"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
